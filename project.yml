name: TodoEditorial
options:
  bundleIdPrefix: com.editorial
  deploymentTarget:
    iOS: "17.0"
targets:
  TodoEditorial:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoEditorial
        excludes:
          - "Resources/Info.plist"
    info:
      path: TodoEditorial/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.editorial.TodoEditorial
        PRODUCT_NAME: TodoEditorial
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        GENERATE_INFOPLIST_FILE: NO
